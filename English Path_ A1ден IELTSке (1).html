<!DOCTYPE html>
<html lang="ky" data-theme="light">
<head>

<title>English Path: A1ден IELTSке</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1d2433;--mut:#667085;--ac:#4f46e5;--ok:#16a34a;--bad:#dc2626;--bd:#e4e7ee;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12141c;--card:#1c202c;--tx:#eceef5;--mut:#9aa3b5;--ac:#818cf8;--ok:#4ade80;--bad:#f87171;--bd:#2c3242;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12141c;--card:#1c202c;--tx:#eceef5;--mut:#9aa3b5;--ac:#818cf8;--ok:#4ade80;--bad:#f87171;--bd:#2c3242;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;line-height:1.5}
.wrap{max-width:720px;margin:0 auto;padding:16px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
header h1{font-size:20px;margin:0;cursor:pointer}
.xp{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:4px 12px;font-weight:600;font-size:14px}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;text-align:left;color:var(--tx);font:inherit;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.card:hover{border-color:var(--ac)}
.card b{font-size:22px;color:var(--ac)}
.card span{color:var(--mut);font-size:14px}
.box{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin:10px 0}
.btn{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ac);border:1px solid var(--bd)}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:10px 0}
.tabs button{white-space:nowrap}
.tabs .on{background:var(--ac);color:#fff;border-color:var(--ac)}
.opt{display:block;width:100%;text-align:left;margin:6px 0;background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;color:var(--tx);font:inherit;cursor:pointer}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--bg))}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 18%,var(--bg))}
.ex{border-left:3px solid var(--ac);padding:2px 10px;margin:6px 0;font-style:italic}
.flash{height:150px;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700;text-align:center;cursor:pointer;user-select:none}
.mg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mg .opt{margin:0;text-align:center}
.mg .sel{border-color:var(--ac)}
.mg .done{visibility:hidden}
table{width:100%;border-collapse:collapse}td{padding:6px 4px;border-bottom:1px solid var(--bd)}
.mut{color:var(--mut)}
.hero{background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;border-radius:18px;padding:24px;margin-bottom:16px}.hero h2{margin:0 0 8px;font-size:26px;line-height:1.2}.hero p{margin:0 0 16px;opacity:.92}.hero .btn{background:#fff;color:#4f46e5;margin:0 6px 6px 0}.hero .btn.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.6)}
.today{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 14%,var(--card))}
.inp{width:100%;margin:4px 0 10px;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
.stage{background:linear-gradient(135deg,#1e1b4b,#4f46e5);color:#fff;border-radius:16px;min-height:250px;padding:24px;display:flex;flex-direction:column;justify-content:center;text-align:center;gap:12px;overflow:hidden}.stage>*{animation:fd .5s}.vh{font-size:28px;font-weight:700;overflow-wrap:anywhere}.vs{font-size:17px;opacity:.92}@keyframes fd{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
:root{--bg:#f4f7fe;--card:#fff;--tx:#0f1b3d;--mut:#64708f;--ac:#2563eb;--bd:#e3e9f6;--sh:0 4px 16px rgba(37,99,235,.08)}
body{font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;padding-bottom:84px}
body::before{content:'';position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:#fff;z-index:20}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:11;background:#fff;margin:-16px -16px 16px;padding:12px 16px;border-bottom:1px solid var(--bd)}
header h1{font-weight:800;color:var(--ac)}
.xp{background:#eff4ff;border-color:#d5e1ff;color:var(--ac)}
h2{font-size:24px;margin:12px 0}
.card{border-radius:18px;box-shadow:var(--sh);transition:transform .15s,border-color .15s}.card:hover{transform:translateY(-2px);border-color:var(--ac)}.card b{font-size:17px;color:var(--tx)}
.box{border-radius:18px;box-shadow:var(--sh)}
.btn{border-radius:12px;box-shadow:0 2px 8px rgba(37,99,235,.25)}.btn.ghost{box-shadow:none;background:#fff}
.tabs button{border-radius:999px}
.opt{border-radius:12px;background:#f8faff}
.sec{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:24px 0 10px}
.hero{background:linear-gradient(135deg,#1d4ed8,#3b82f6 60%,#60a5fa);position:relative;overflow:hidden;box-shadow:0 10px 30px rgba(37,99,235,.28);padding:28px 24px}.hero>*{position:relative}.hero>svg{position:absolute;right:-8px;bottom:-8px;width:150px;opacity:.22}.hero h2{color:#fff;font-size:28px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#fff;border:1px solid var(--bd);border-radius:16px;padding:12px;text-align:center;box-shadow:var(--sh)}.stat b{display:block;font-size:20px;color:var(--ac)}.stat span{font-size:12px;color:var(--mut)}
.ic{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;color:#fff;margin-bottom:8px}.tint{background:color-mix(in srgb,var(--c) 14%,#fff);font-size:22px}
.stage{background:linear-gradient(135deg,#1e3a8a,#2563eb)}
.nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--bd);z-index:12;padding-bottom:env(safe-area-inset-bottom,0px)}.nav div{display:flex;max-width:720px;margin:0 auto}.nav button{flex:1;background:none;border:0;padding:8px 4px;font:inherit;font-size:12px;color:var(--mut);cursor:pointer}.nav button span{display:block;font-size:20px}
.slots{min-height:54px;border:2px dashed var(--bd);border-radius:14px;padding:8px;display:flex;gap:6px;flex-wrap:wrap;margin:10px 0;align-items:center}.slots.okb{border:2px solid var(--ok);background:color-mix(in srgb,var(--ok) 12%,#fff)}.slots.badb{border:2px solid var(--bad);background:color-mix(in srgb,var(--bad) 12%,#fff)}.tiles{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.tile{min-width:42px;padding:10px 12px;border-radius:12px;border:1px solid var(--bd);background:#fff;font:inherit;font-weight:700;font-size:18px;cursor:pointer;box-shadow:var(--sh);color:var(--tx)}.tile:disabled{opacity:.3}.tile.on{background:#eff4ff;border-color:var(--ac);color:var(--ac)}
.fm{background:linear-gradient(135deg,#1d4ed8,#3b82f6);color:#fff;border-radius:18px;padding:18px 20px;font-size:20px;font-weight:700;margin:12px 0;box-shadow:0 8px 22px rgba(37,99,235,.25);overflow-wrap:anywhere}.fm span{display:block;font-size:12px;opacity:.8;font-weight:600;letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px}
.rl b{color:var(--ac)}.rl p{margin:6px 0 0}
.exr{display:flex;justify-content:space-between;align-items:center;gap:10px}.en{font-size:18px;font-weight:600}.en mark{background:#dbeafe;color:#1d4ed8;border-radius:6px;padding:0 4px}
.bd{color:var(--bad)}.gd{color:var(--ok);font-weight:600}.tp{background:#fffbeb;border-color:#fde68a}
.ln{margin:6px 0;line-height:1.5}.key{display:block;width:fit-content;max-width:100%;background:#eff4ff;color:#1d4ed8;border:1px solid #bfd3ff;border-left:5px solid #2563eb;border-radius:12px;padding:8px 14px;margin:8px 0;font-size:20px;font-weight:800;line-height:1.35;overflow-wrap:anywhere}
.grid2{display:grid;gap:10px}.tcard{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--bd);border-radius:16px;padding:12px 14px;text-align:left;font:inherit;color:var(--tx);cursor:pointer;box-shadow:var(--sh)}.tcard:hover{border-color:var(--ac)}.tcard b{font-size:16px}.num{width:34px;height:34px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;flex:none}.tnav{display:flex;gap:8px;justify-content:space-between;margin:14px 0}
.wd{font-size:22px;font-weight:800;color:var(--ac)}.wk{font-weight:700;margin:2px 0 8px}.wc .en{font-size:16px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;background:#0f1b3d;color:#fff;padding:10px 16px;border-radius:14px;z-index:30;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:90%;text-align:center}
</style>
</head>
<body>
<div class="wrap">
<header><h1 onclick="home()">🇬🇧 English Path</h1><div class="xp">⭐ <span id="xp">0</span> XP</div></header>
<div id="app"></div>
</div>
<script>
const L={
A1:{n:"Баштоочу",g:{t:"To be: am / is / are",l:"I менен am, he/she/it менен is, we/you/they менен are колдонулат.",ex:["I am a student. (Мен окуучумун.)","She is happy. (Ал кубанычта.)","They are friends. (Алар достор.)"],q:[["I ___ from Kyrgyzstan.",["am","is","are"],0],["He ___ a teacher.",["am","is","are"],1],["We ___ ready.",["am","is","are"],2]]},
 v:{t:"Үй-бүлө",w:[["mother","эне"],["father","ата"],["brother","ага/ини"],["sister","эже/сиңди"],["grandmother","чоң эне"],["uncle","aке/таяке"]]}},
A2:{n:"Алгачкы",g:{t:"Past Simple",l:"Өткөн чакта аяктаган иш. Туура этиштерге -ed кошулат. Туура эмес этиштер өзгөчө: go → went, see → saw.",ex:["I played football yesterday. (Кечээ футбол оюнадым.)","She went to school. (Ал мектепке барды.)"],q:[["Yesterday I ___ TV.",["watch","watched","watching"],1],["She ___ to Bishkek last week.",["go","goes","went"],2],["They ___ pizza.",["eated","ate","eat"],1]]},
 v:{t:"Тамак-аш",w:[["bread","нан"],["cheese","быштак"],["rice","дан/күрүч"],["chicken","тоок эти"],["vegetables","жашылчалар"],["delicious","даамдуу"]]}},
B1:{n:"Орто",g:{t:"Present Perfect",l:"have/has + 3-форма. Өткөндө болуп, азыркыга тиешеси бар иш же тажрыйба.",ex:["I have visited Almaty. (Алматыда болгонмун.)","She has finished her homework. (Ал тапшырманы бүтүрдү.)"],q:[["I ___ never seen snow.",["have","has","had"],0],["He has ___ his keys.",["lose","lost","losing"],1],["We have ___ here for two years.",["live","lived","living"],1]]},
 v:{t:"Жумуш",w:[["salary","маяна"],["colleague","кесиптеш"],["deadline","акыркы мөөнөт"],["interview","маектешүү"],["experience","тажрыйба"],["apply","арыз берүү"]]}},
B2:{n:"Жогорку орто",g:{t:"Second Conditional",l:"If + Past Simple, would + этиш. Реалдуу эмес же күмөн абалды билдирет.",ex:["If I had more time, I would learn French. (Убактым көп болсо, француз тилин үйрөнөт элем.)"],q:[["If I ___ rich, I would travel the world.",["am","were","will be"],1],["She ___ help you if she knew.",["will","would","did"],1],["If we ___ earlier, we would catch the bus.",["left","leave","had leave"],0]]},
 v:{t:"Экология",w:[["pollution","булганыш"],["recycle","кайра иштетүү"],["renewable","калыбына келүүчү"],["climate","климат"],["emission","чыгарынды"],["sustainable","туруктуу"]]}},
IELTS:{n:"IELTS (C1)",g:{t:"Linking words",l:"Writing жана Speaking үчүн маанилүү. However / Nevertheless (каршы пикир), Moreover / Furthermore (кошумча), Therefore / Consequently (натыйжа), Although (карабастан).",ex:["Although it was expensive, many people bought it.","Moreover, the policy reduces costs."],q:[["The test was hard; ___, I passed.",["moreover","however","therefore"],1],["Exercise is healthy. ___, it improves mood.",["Furthermore","Although","However"],0],["___ it rained, we went out.",["Therefore","Although","Moreover"],1]]},
 v:{t:"Academic words",w:[["significant","олуттуу"],["demonstrate","көрсөтүү"],["approach","мамиле/ыкма"],["establish","түзүү/орнотуу"],["consequence","натыйжа"],["controversial","талаштуу"]]}}
};
let xp=0;let TAG='grammar';const $=s=>document.getElementById(s);
const app=$('app');
function add(n){xp+=n;$('xp').textContent=xp}
function sh(a){return a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1])}
function home(){
 app.innerHTML=`<p class="mut">Деңгээлиңизди тандаңыз. Ар биринде грамматика, сөздүк жана оюндар бар.</p><div class="grid">${Object.keys(L).map(k=>`<button class="card" onclick="lvl('${k}')"><b>${k}</b><span>${L[k].n}</span></button>`).join('')}</div>`}
function lvl(k){
 const d=L[k];
 app.innerHTML=`<button class="btn ghost" onclick="home()">← Артка</button><h2>${k}: ${d.n}</h2><div class="grid"><button class="card" onclick="gram('${k}')"><b>📘 Грамматика</b><span>${d.g.t}</span></button><button class="card" onclick="voc('${k}','list')"><b>🔤 Сөздүк</b><span>${d.v.t}</span></button></div>`}
function gram(k,m){
 const g=L[k].g;m=m||'l';TAG='grammar';
 const tabs=`<div class="tabs"><button class="btn ghost ${m=='l'?'on':''}" onclick="gram('${k}','l')">Сабак</button><button class="btn ghost ${m=='q'?'on':''}" onclick="gram('${k}','q')">Оюн: Тест</button></div>`;
 app.innerHTML=`<button class="btn ghost" onclick="lvl('${k}')">← ${k}</button><h2>${g.t}</h2>${tabs}<div id="c"></div>`;
 if(m=='l')$('c').innerHTML=`<div class="box"><p>${g.l}</p>${g.ex.map(e=>`<div class="ex">${e}</div>`).join('')}</div>`;
 else quiz(g.q.map(x=>({q:x[0],o:x[1],a:x[2]})))}
function quiz(items){
 let i=0,s=0;
 function r(){
  if(i>=items.length){$('c').innerHTML=`<div class="box"><h3>Жыйынтык: ${s} / ${items.length}</h3><button class="btn" onclick="this.parentNode.remove();">OK</button></div>`;return}
  const it=items[i];
  $('c').innerHTML=`<div class="box"><p class="mut">Суроо ${i+1} / ${items.length}</p><h3>${it.q}</h3>${it.o.map((o,j)=>`<button class="opt" data-j="${j}">${o}</button>`).join('')}</div>`;
  $('c').querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
   const j=+b.dataset.j;
   $('c').querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(+x.dataset.j==it.a)x.classList.add('ok')});
   if(j==it.a){s++;add(10)}else b.classList.add('bad');rec(TAG,j==it.a,it.q);
   setTimeout(()=>{i++;r()},900)})}
 r()}
function voc(k,m){
 const v=L[k].v;TAG='vocab';
 const T=[['list','Сөздөр'],['fc','Карточка'],['mt','Эшлештирүү'],['qz','Тест']];
 app.innerHTML=`<button class="btn ghost" onclick="lvl('${k}')">← ${k}</button><h2>${v.t}</h2><div class="tabs">${T.map(t=>`<button class="btn ghost ${m==t[0]?'on':''}" onclick="voc('${k}','${t[0]}')">${t[1]}</button>`).join('')}</div><div id="c"></div>`;
 const c=$('c');
 if(m=='list')c.innerHTML=`<div class="box"><table>${v.w.map(w=>`<tr><td><b>${w[0]}</b></td><td class="mut">${w[1]}</td></tr>`).join('')}</table></div>`;
 if(m=='fc'){
  let i=0,f=false;
  const r=()=>{c.innerHTML=`<div class="box flash" id="f">${f?v.w[i][1]:v.w[i][0]}</div><p class="mut" style="text-align:center">Басып буруңуз (${i+1} / ${v.w.length})</p><div style="text-align:center"><button class="btn" id="nx">Кийинки →</button></div>`;
   $('f').onclick=()=>{f=!f;r()};$('nx').onclick=()=>{i=(i+1)%v.w.length;f=false;add(2);r()}};r()}
 if(m=='mt'){
  let e=null,left=v.w.length;
  const E=sh(v.w.map(w=>w[0])),K=sh(v.w.map(w=>w[1]));
  c.innerHTML=`<div class="mg" id="mg">${E.map(x=>`<button class="opt" data-s="e" data-v="${x}">${x}</button>`).join('')}${K.map(x=>`<button class="opt" data-s="k" data-v="${x}">${x}</button>`).join('')}</div><p id="msg" class="mut"></p>`;
  const bs=[...c.querySelectorAll('.opt')];
  const en=bs.filter(b=>b.dataset.s=='e'),kg=bs.filter(b=>b.dataset.s=='k');
  const grid=$('mg');grid.innerHTML='';
  for(let j=0;j<v.w.length;j++){grid.appendChild(en[j]);grid.appendChild(kg[j])}
  bs.forEach(b=>b.onclick=()=>{
   if(b.dataset.s=='e'){en.forEach(x=>x.classList.remove('sel'));b.classList.add('sel');e=b;return}
   if(!e)return;
   const ok=v.w.some(w=>w[0]==e.dataset.v&&w[1]==b.dataset.v);
   if(ok){e.classList.add('done');b.classList.add('done');add(5);left--;if(!left)$('msg').textContent='Азаматсыз! Баары табылды 🎉'}
   else{b.classList.add('bad');setTimeout(()=>b.classList.remove('bad'),500)}
   e.classList.remove('sel');e=null})}
 if(m=='qz'){
  quiz(v.w.map(w=>({q:`"${w[0]}" деген эмне?`,o:sh([w[1],...sh(v.w.filter(x=>x!=w)).slice(0,2).map(x=>x[1])]),a:0})).map(it=>{const right=v.w.find(w=>it.q.includes(`"${w[0]}"`))[1];it.a=it.o.indexOf(right);return it}))}
}
let S={xp:0,sk:{},miss:[],w:0,sp:0};
try{S=Object.assign(S,JSON.parse(localStorage.getItem('ep1')||'{}'))}catch(e){}
function save(){try{localStorage.setItem('ep1',JSON.stringify(S))}catch(e){}}
add=function(n){S.xp+=n;$('xp').textContent=S.xp;save()};
$('xp').textContent=S.xp;
function rec(tag,ok,q){const s=S.sk[tag]=S.sk[tag]||{c:0,t:0};s.t++;if(ok)s.c++;else{S.miss.unshift({tag,q});S.miss=S.miss.slice(0,8)}save()}
const bk=(f,l)=>`<button class="btn ghost" onclick="${f}()">← ${l}</button>`;
const _h=home;home=function(){_h();app.innerHTML+=`<h3>Кошумча</h3><div class="grid"><button class="card" onclick="ielts()"><b>🎓 IELTS борбору</b><span>Reading, Listening, Speaking, Writing, сөздөр</span></button><button class="card" onclick="prog()"><b>📊 Прогресс</b><span>Каталар жана кеңештер</span></button></div>`};
const _l=lvl;lvl=function(k){k=='IELTS words'?iv():_l(k)};
function ielts(){app.innerHTML=bk('home','Башкы бет')+`<h2>IELTS борбору</h2><div class="grid">${[['📖 Reading','rd'],['🎧 Listening','ls'],['🎤 Speaking','sp'],['✍️ Writing','wr'],['🔤 IELTS сөздөрү','iv']].map(x=>`<button class="card" onclick="${x[1]}()"><b>${x[0]}</b></button>`).join('')}</div>`}
const IW=[["5.5–6.0",[["allocate","бөлүштүрүү"],["benefit","пайда"],["community","коомчулук"],["environment","чөйрө"],["evidence","далил"],["factor","фактор"],["income","киреше"],["issue","маселе"]]],["6.5–7.0",[["alleviate","жеңилдетүү"],["coherent","логикалуу"],["detrimental","зыяндуу"],["fluctuate","термелүү"],["inevitable","сөзсүз болуучу"],["mitigate","азайтуу"],["scrutinize","кылдат изилдөө"],["undermine","алсыратуу"]]],["7.5+",[["ubiquitous","кеңири таралган"],["ambiguous","эки мааниле"],["meticulous","өтө так"],["paradigm","үлгү, модель"],["pragmatic","практикалык"],["resilient","чыдамкай"],["substantiate","далилдөө"],["versatile","көп кырдуу"]]]];

ingual children often show stronger attention control. (T/F/NG)",o:TF,a:0},{q:"All researchers agree on the attention advantage. (T/F/NG)",o:TF,a:1},{q:"Learning a language early helps with:",o:["Native-like pronunciation","Mathematics","Reading speed"],a:0}]});

{h:'Passage 1',text:`The Urban Beekeeping Debate
A. Over the past fifteen years, beekeeping has moved from the countryside to the rooftops of major cities. One large capital city now hosts roughly 5,000 registered hives, and several other cities report similar numbers. City authorities initially welcomed the trend, believing that it would help to protect honeybees, whose numbers had fallen sharply in rural areas because of pesticides and the loss of wildflower meadows.
B. However, a study by a university research team in 2019 challenged this assumption. After surveying flower availability across several districts, the team concluded that the supply of nectar in many cities cannot support the growing number of hives. In some neighbourhoods, honeybees now compete directly with wild pollinators such as bumblebees and hoverflies, which are much less well known to the public but which pollinate many more plant species in total.
C. Dr Helena Marsh, who led the research, stressed that she was not against beekeeping. “Honeybees are not endangered as a species,” she said. “What is endangered is the wider community of wild pollinators, and they need food and nesting sites, not extra competitors.” Her team recommended that city councils limit the number of hives per square kilometre until more flowering plants have been planted.
D. Not everyone agrees. A national beekeepers’ association argues that the competition is overstated, pointing out that most hobbyists keep only one or two hives and that honeybee colonies forage over distances of up to three kilometres, which spreads their impact across large areas. The association also notes that beekeeping increases public interest in nature: a survey of 800 new beekeepers found that almost two thirds had begun planting bee-friendly flowers in their gardens as a result.
E. Some cities have found a compromise. In one European capital, the council pays for flower strips along tram lines, while in a Canadian city, owners of green roofs are required to plant native species before they are allowed to install hives. Marsh welcomes such measures but believes the evidence is still too thin. “We need ten years of data, not ten months,” she says.`,g:[

{h:'Passage 2',text:`Sleep and the Teenage Brain
A. Parents of teenagers often complain that their children cannot get out of bed in the morning. For decades this was blamed on laziness. Research since the 1990s, however, shows that the adolescent body clock genuinely shifts during puberty: melatonin, the hormone that signals it is time to sleep, is released about two hours later in teenagers than in young children.
B. This biological shift collides with early school start times. In most countries lessons begin between 7.30 and 8.30 a.m., which forces many teenagers to wake at the point when their brains are still producing melatonin. A large study followed 9,000 students in eight high schools and found that those whose schools moved the start time from 7.35 to 8.35 a.m. slept on average 45 minutes longer each night.
C. The consequences of insufficient sleep go beyond tiredness. In the same study, students at later-starting schools reported fewer symptoms of depression, and the number of car accidents involving teenage drivers in their districts fell by almost a quarter. Attendance also improved, although the effect on examination results was smaller than the researchers had expected.
D. Critics point to practical difficulties. Later finishing times can clash with sports training, part-time jobs and school bus timetables, and some parents worry about the cost of rearranging family routines. Teachers’ unions in several countries have also expressed concern about longer working days. One school district that had adopted the change reversed its decision after only three years because of budget pressures.
E. A different approach has been tried in Japan and parts of Scandinavia, where schools teach pupils about sleep hygiene — for instance, avoiding screens for an hour before bed and keeping a regular bedtime. Evidence for this approach is mixed: pupils understand the advice but often fail to follow it, particularly when social media keeps them online late.
F. Most sleep scientists therefore conclude that education alone is not enough and that changing the school day, where possible, offers the greatest benefit. They stress, however, that no single policy suits every community, and that parents, teachers and students should all be consulted before any change is made.`,g:[

{h:'Passage 3',text:`Should Public Transport Be Free?
A. In 2021 the city of Varnholm, home to 400,000 people, abolished fares on all of its buses and trams. The decision was controversial, but the mayor argued that it would reduce congestion, improve air quality and make the city fairer to people on low incomes. Two smaller towns in the region, Oskarby and Linden, had introduced similar schemes several years earlier, and their results were closely watched.
B. In Oskarby, where the scheme began in 2015, bus journeys rose by 40 per cent within twelve months. Surveys showed that fewer than one in five of the new passengers had previously used a car; most had been walking or cycling, or had simply not made the journey at all. The town council nevertheless considered the policy a success because it had helped older residents and young people to take part in community life.
C. Linden’s experience was different. The town introduced free travel in 2017 but made no changes to its ageing bus fleet. Within two years, overcrowding had become so severe that many regular commuters returned to their cars, and the council ended the scheme in 2020. A review concluded that the policy had failed not because free travel is a bad idea, but because the service was not ready for the extra demand.
D. Varnholm’s planners say they have learned from both towns. Before abolishing fares, the city bought 60 new buses and added dedicated bus lanes on its busiest roads, at a cost of 90 million euros. The money for the fare-free scheme itself, around 25 million euros a year, comes from a small increase in parking charges and a tax on large employers in the city centre.
E. Economists are divided. Some argue that fares are an efficient way of managing demand and that, without them, passengers have no reason to avoid travelling at the busiest times. Others reply that the cost of collecting fares — ticket machines, inspectors and administration — takes up as much as one fifth of the revenue, so the real saving from abolishing them is smaller than it appears.
F. Early results from Varnholm are encouraging but incomplete. After one year, weekday bus use had risen by 28 per cent, and the city’s traffic counts showed a drop of 6 per cent in cars entering the centre. However, the city’s own report warns that these figures could change as the novelty fades.
G. The question of fairness remains open. Residents of the suburbs, who use public transport less frequently, are paying higher parking charges to fund a service they rarely use. The mayor insists that the benefits to the whole city — cleaner air and less congestion — justify this, but opponents plan to challenge the policy at the next election.`,g:[

{h:'Section 1',script:[['F',`Good morning, Riverside Language Centre. How can I help?`],['M',`Hello, I'd like to enrol on an evening English course, please.`],['F',`Certainly. Can I take your name?`],['M',`Yes, it's Daniel Kowalski. That's K, O, W, A, L, S, K, I.`],['F',`Thank you. And your phone number?`],['M',`It's oh seven seven four, nine three eight, six two one.`],['F',`Lovely. Which level are you?`],['M',`I did a test last month, and they said intermediate.`],['F',`Great. We have two intermediate courses: one on Tuesdays and Thursdays from half past six to eight, and another on Saturday mornings.`],['M',`Tuesdays and Thursdays suits me better, because I work on Saturdays.`],['F',`The course lasts ten weeks and starts on the fourteenth of October. The fee is two hundred and eighty pounds, which includes the course book.`],['M',`Is there a discount for students?`],['F',`Yes, ten per cent for full-time students, but you would need to show your student card.`],['M',`I'm a part-time student, so I suppose not.`],['F',`I'm afraid not. The classes are in room twelve, on the second floor of the Harbour Building.`],['M',`Where's the nearest parking?`],['F',`There is a car park behind the building, but it is expensive, so most students take the number nine bus.`],['M',`Thanks very much. Could you email me a confirmation?`]],g:[{ins:'Questions 1–10: Complete the form. ONE WORD AND/OR A NUMBER',qs:[Qf('Surname: ___','Kowalski'),Qf('Phone number: ___','0774938621','0774 938 621'),Qf('Level of course: ___','intermediate'),Qf('Course days: ___ and Thursdays','Tuesdays','Tuesday'),Qf('Length of course: ___ weeks','ten','10'),Qf('Start date: ___ October','fourteenth','14th','14'),Qf('Fee: £___','280','two hundred and eighty'),Qf('Discount for ___ students','full-time','full time'),Qf('Room number: ___ (second floor)','12','twelve'),Qf('Most students travel by number ___ bus','9','nine')]}]},
{h:'Section 2',script:[['F',`Good afternoon, everyone, and welcome to Hillcrest Country Park. My name's Ruth and I'll be your guide for the next ninety minutes. Before we start, a few practical points. The park is open from eight in the morning until dusk, and the visitor centre, where you'll find the café, closes at five. If you have a car, please use the lower car park; the upper one is reserved for disabled visitors and for minibuses. Our first stop will be the lake. It was created in 1952 when the river was dammed, and it is now home to more than sixty species of birds. Please keep to the path, because the reeds on the left-hand side are a protected nesting area. After the lake we'll walk through the woodland. This part of the walk is about two kilometres and mostly flat, but there's one steep section near the old stone bridge, so please wear sensible shoes. Dogs are welcome in the woodland, but they must be kept on a lead from April to July. The tour finishes at the farm shop, where you can buy local honey and cheese. Many visitors also enjoy the children's trail, which is signposted in yellow, and the sculpture trail, which is marked in blue. If you're interested in guided evening walks, you can book at the visitor centre; they cost six pounds per person, but are free for members.`]],g:[{ins:'Questions 11–20: Choose the correct letter, A, B or C',qs:[Qm('The visitor centre closes at',['4 pm.','5 pm.','dusk.'],1),Qm('The upper car park is reserved for',['disabled visitors and minibuses.','staff only.','coaches.'],0),Qm('The lake was created in',['1925.','1952.','1992.'],1),Qm('The lake is home to',['more than sixty species of birds.','about sixteen species of birds.','over six hundred species of birds.'],0),Qm('Visitors must keep to the path near the reeds because',['the plants are rare.','it is a protected nesting area.','the water is dangerous.'],1),Qm('The woodland walk is about',['1 km.','2 km.','5 km.'],1),Qm('Dogs must be kept on a lead',['all year.','from April to July.','never.'],1),Qm('The tour finishes at',['the lake.','the visitor centre.','the farm shop.'],2),Qm('The sculpture trail is marked in',['yellow.','blue.','red.'],1),Qm('Evening walks cost non-members',['£3.','£6.','£16.'],1)]}]},
{h:'Section 3',script:[['F',`Tom, have you decided which part of the plastic waste presentation you want to take?`],['M',`I was thinking of doing the section on recycling rates, but I'm not sure about the data. Professor Hale said we should use figures from the last five years only.`],['F',`Right, and she wants them from official sources rather than websites. I could find the government statistics, if you like.`],['M',`That would be great. In return I'll prepare the slides. What are you planning to cover yourself?`],['F',`I'd like to talk about microplastics in the ocean. I read an article saying that, by weight, the amount of microplastics is smaller than people think, but they're much harder to clean up.`],['M',`Interesting. Shall we include a short video? The tutor said visuals are worth fifteen per cent of the mark.`],['F',`Yes, but only a short one, no more than two minutes. The whole presentation has to be twenty minutes, plus five for questions.`],['M',`When do we have to hand in the outline?`],['F',`By Friday the twentieth, and we also have to submit a reference list.`],['M',`Then let's meet on Wednesday afternoon in the library to practise. Group study room four is free from two o'clock.`],['F',`Perfect. And let's agree that whoever finishes first checks the other's slides for spelling mistakes.`]],g:[{ins:'Questions 21–30: Choose the correct letter, A, B or C',qs:[Qm('Tom plans to talk about',['recycling rates.','ocean microplastics.','packaging design.'],0),Qm('Professor Hale wants figures from the last',['two years.','five years.','ten years.'],1),Qm('Maya will find',['government statistics.','newspaper articles.','company reports.'],0),Qm('Tom will prepare',['the slides.','the video.','the outline.'],0),Qm('According to the article, microplastics are',['heavier in total than people think.','smaller in weight but harder to clean up.','easy to remove from the ocean.'],1),Qm('Visuals are worth',['5% of the mark.','15% of the mark.','50% of the mark.'],1),Qm('The video must last',['one minute at most.','two minutes at most.','five minutes at most.'],1),Qm('The presentation lasts',['20 minutes plus 5 for questions.','25 minutes in total with no questions.','30 minutes plus 10 for questions.'],0),Qm('The outline is due on',['Wednesday.','Friday the twentieth.','Monday.'],1),Qm('They will practise',['on Wednesday afternoon in the library.','on Friday morning at home.','on Monday evening online.'],0)]}]},
{h:'Section 4',script:[['M',`Today I'd like to talk about urban heat islands, the phenomenon where cities are noticeably warmer than the surrounding countryside. On a calm summer night, the temperature difference can reach as much as seven degrees Celsius. There are three main causes. The first is the materials used in construction. Dark surfaces such as asphalt and roofing tiles absorb heat during the day and release it slowly at night, whereas vegetation cools the air through evaporation. The second cause is the shape of cities. Tall buildings close together trap warm air between them and block the wind, an effect that geographers call the canyon effect. The third cause is human activity: air conditioning units, vehicles and factories all release additional heat. The consequences are serious. Heat waves in cities lead to more deaths among older people, and energy demand rises sharply because of air conditioning. A study in a large Spanish city found that electricity use increased by about four per cent for every degree of temperature rise. What can be done? Planting trees is the most popular solution, and a mature tree can reduce the temperature in its immediate surroundings by up to three degrees. Another approach is the use of reflective paint on roofs, which has been tested in California and reduced indoor temperatures by around two degrees. Finally, some planners are redesigning streets to create corridors along which cooler air from nearby rivers can flow into the city centre.`]],g:[{ins:'Questions 31–40: Complete the notes. ONE WORD AND/OR A NUMBER',qs:[Qf('At night the temperature difference can reach ___ °C','7','seven'),Qf('Dark surfaces such as asphalt and roofing ___ absorb heat','tiles'),Qf('Vegetation cools the air through ___','evaporation'),Qf('Tall buildings block the ___','wind'),Qf('Geographers call this the ___ effect','canyon'),Qf('Human activity: vehicles, factories and air ___ units','conditioning'),Qf('Electricity use rose by about ___ per cent for every degree','4','four'),Qf('A mature tree can reduce temperature by up to ___ degrees','3','three'),Qf('Reflective roof paint was tested in ___','California'),Qf('Planners create ___ for cooler air from rivers','corridors','corridor')]}]}]}};

let MK=null,ANS={},MTI=null,SPS=null;
function mocks(){const m=S.mocks||{};const row=(id,t,sub)=>`<button class='card' onclick="mockStart('${id}')"><div class='ic tint' style='--c:#2563eb'>${id[0]=='r'?'📖':'🎧'}</div><b>${t}</b><span>${sub}${m[id]?' · Эң жакшы: Band '+m[id].best:''}</span></button>`;app.innerHTML=bk('ielts','IELTS')+`<h2>📝 Мок тесттер</h2><p class='mut'>Чыныгы экзамен форматында: 40 суроо, таймер, жыйынтыкта band жана туура жооптор. Тексттер жана сандар окуу үчүн оригиналдуу жазылган (чыныгы экзамен материалы эмес).</p><div class='grid'>${row('r1','Reading Mock 1','40 суроо · 60 мүнөт')}${row('l1','Listening Mock 1','40 суроо · 30 мүнөт')}</div><div class='sec'>🎤 Speaking Mock</div><div class='grid'>${[0,1,2].map(i=>`<button class='card' onclick='spm(${i})'><div class='ic tint' style='--c:#ef4444'>🎤</div><b>Speaking Mock ${i+1}</b><span>Part 1 + 2 + 3 · ИИ баа</span></button>`).join('')}</div>`}
function mockStart(id){const m=MOCKS[id];let n=0;m.secs.forEach(s=>s.g.forEach(g=>g.qs.forEach(q=>q.n=++n)));MK={id,m,sec:0,end:Date.now()+m.min*60000,tot:n};ANS={};clearInterval(MTI);MTI=setInterval(mtick,1000);mrender()}
function mtick(){if(!MK)return;const t=Math.max(0,MK.end-Date.now()),e=$('mtm');if(e)e.textContent='⏱ '+Math.floor(t/60000)+':'+String(Math.floor(t/1000)%60).padStart(2,'0');if(t<=0)msubmit()}
function mq(q){const v=ANS[q.n];let h=`<div class='box'><b>${q.n}.</b> ${E(q.q)}`;if(q.t=='fill')h+=`<input class='inp' value="${E(v||'').replace(/"/g,'&quot;')}" oninput='ma(${q.n},this.value)' autocomplete='off'>`;else{const o=q.t=='tf'?['True','False','Not Given']:q.o;h+=o.map((x,j)=>`<label style='display:block;padding:6px 0'><input type='radio' name='q${q.n}' ${v===j?'checked':''} onchange='ma(${q.n},${j})'> ${q.t=='mc'?String.fromCharCode(65+j)+'. ':''}${E(x)}</label>`).join('')}return h+'</div>'}
function ma(n,v){ANS[n]=v}
function mrender(){const k=MK,m=k.m,s=m.secs[k.sec],li=m.type=='listening';const tabs=m.secs.map((x,i)=>`<button class='btn ghost ${i==k.sec?'on':''}' onclick='msec(${i})'>${x.h}</button>`).join('');
const body=(li?`<div class='box'><b>🎧 ${s.h}</b><p class='mut'>Үн америкалык акцент менен окулат. Алдын ала суроолорду окуп алыңыз.</p><button class='btn' onclick='mplay()'>▶ Угуу</button> <button class='btn ghost' onclick='stopAudio()'>■</button> <button class='btn ghost' onclick='SPD=.7'>🐢 Жай</button> <button class='btn ghost' onclick='SPD=.9'>Орто</button></div>`:`<div class='box' style='max-height:340px;overflow:auto'>${s.text.split('\n').map((p,i)=>i?`<p>${E(p)}</p>`:`<h3>${E(p)}</h3>`).join('')}</div>`)+s.g.map(g=>`<div class='sec'>${E(g.ins)}</div>`+g.qs.map(mq).join('')).join('');
app.innerHTML=`<div style='position:sticky;top:56px;z-index:5;background:var(--bg);padding:6px 0'><div style='display:flex;justify-content:space-between;align-items:center'><b>${m.title}</b><b id='mtm'></b><button class='btn' onclick='mfinish()'>Бүтүрүү</button></div><div class='tabs'>${tabs}</div></div>`+body;mtick()}
function mplay(){playScript(MK.m.secs[MK.sec].script)}
function msec(i){MK.sec=i;stopAudio();mrender();window.scrollTo&&scrollTo(0,0)}
function mfinish(){const un=MK.tot-Object.keys(ANS).filter(k=>ANS[k]!==''&&ANS[k]!=null).length;if(un>0&&!confirm(un+' суроого жооп берилген жок. Бүтүрөбүзбү?'))return;msubmit()}
function msubmit(){clearInterval(MTI);stopAudio();const k=MK;if(!k)return;let c=0;const rows=[],TF=['True','False','Not Given'];k.m.secs.forEach(s=>s.g.forEach(g=>g.qs.forEach(q=>{const u=ANS[q.n];let ok,cor,us;if(q.t=='fill'){ok=u!=null&&q.a.some(a=>cmp(a,u));cor=q.a[0];us=u}else{const o=q.t=='tf'?TF:q.o;ok=u===q.a;cor=o[q.a];us=u==null?null:o[u]}if(ok)c++;rows.push({n:q.n,q:q.q,u:us==null||us===''?'—':us,cor,ok})})));
const band=cv(k.m.type=='listening'?LB:RB,c);S.mocks=S.mocks||{};const b=S.mocks[k.id]||{best:0,n:0};b.n++;b.best=Math.max(b.best,band);b.last=band;b.sc=c;S.mocks[k.id]=b;add(c*2);save();
app.innerHTML=bk('mocks','Мок тесттер')+`<div class='box' style='text-align:center'><h1>${c} / ${k.tot}</h1><h2>Band ${band}</h2><p class='mut'>(Academic таблицасы боюнча болжолдуу) · +${c*2} XP</p></div>`+(k.m.type=='listening'?k.m.secs.map(s=>`<details class='box'><summary>${s.h}: транскрипт</summary>${s.script.map(x=>`<p>${E(x[1])}</p>`).join('')}</details>`).join(''):'')+`<div class='sec'>Жооптор</div>`+rows.map(r=>`<div class='box'><b>${r.n}.</b> ${E(r.q)}<br>${r.ok?'✅':'❌'} Сиз: <b>${E(r.u)}</b>${r.ok?'':` · Туура: <b>${E(r.cor)}</b>`}</div>`).join('');MK=null}
function spm(i){const T=SPM[i];SPS={i,a:[],n:0,steps:[...T.p1.flatMap(t=>t[1].map(q=>['Part 1 · '+t[0],q])),['Part 2',T.p2],...T.p3.map(q=>['Part 3',q])]};spq()}
function spq(){const f=SPS,st=f.steps[f.n],p2=st[0]=='Part 2',q=st[1].split('|');app.innerHTML=bk('mocks','Мок тесттер')+`<h2>Speaking Mock ${f.i+1}</h2><div class='box'><p class='mut'>${f.n+1} / ${f.steps.length} · ${E(st[0])}</p><b>${E(q[0])}</b>${q[1]?`<p>${E(q[1])}</p>`:''}${p2?`<p class='mut' id='tmr'>Даярдык 60 сек, анан 2 мүнөт</p><button class='btn ghost' onclick='t2()'>⏱ Таймер</button> `:''}<button class='btn' id='mic' onclick='mic()'>🎙 Жазуу</button><textarea id='st' style='width:100%;height:110px;margin:10px 0;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:10px;font:inherit'></textarea><button class='btn' onclick='spn()'>${f.n+1<f.steps.length?'Кийинки →':'📊 Баа алуу'}</button></div>`}
function spn(){const f=SPS;f.a[f.n]=$('st').value;if(f.n+1<f.steps.length){f.n++;spq();return}TASK=f.steps.map(s=>s[0]+': '+s[1].replace('|',' ')).join('\n');const txt=f.steps.map((s,i)=>'Q: '+s[1].split('|')[0]+'\nA: '+(f.a[i]||'(no answer)')).join('\n');app.innerHTML=bk('mocks','Мок тесттер')+`<h2>Speaking Mock ${f.i+1}: жыйынтык</h2><div class='box'><textarea id='st' style='display:none'></textarea><div id='out'></div></div>`;$('st').value=txt;grade('s')}
const _ie=ielts;ielts=function(){_ie();app.insertAdjacentHTML('beforeend',`<div class='sec'>Мок тесттер жана үн</div><div class='grid'><button class='card' onclick='mocks()'><div class='ic tint' style='--c:#2563eb'>📝</div><b>Мок тесттер</b><span>40 суроо, таймер, band</span></button><button class='card' onclick='voices()'><div class='ic tint' style='--c:#22c55e'>🔊</div><b>Үн орнотуулары</b><span>Америкалык үндү тандоо</span></button></div>`)};

function bandf(){const m=S.mocks||{},b=S.b||{s:[],w:[]};if(m.l1)$('bx_l').value=m.l1.sc;if(m.r1){$('bx_r').value=m.r1.sc;$('bx_rt').value='a'}const w=b.w[b.w.length-1],s=b.s[b.s.length-1];if(w!=null)$('bx_w2').value=String(w);if(s!=null)['bx_s1','bx_s2','bx_s3','bx_s4'].forEach(i=>$(i).value=String(s));bandu()}
